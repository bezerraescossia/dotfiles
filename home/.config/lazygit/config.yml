customCommands:
  - key: 'C'
    command: "git commit -m '{{.Form.Type}}{{if .Form.Scope}}({{.Form.Scope}}){{end}}: {{.Form.Message}}'"
    context: 'files'
    description: 'Commit using Conventional Commits specification'
    prompts:
      - type: 'menu'
        title: 'Select commit type'
        key: 'Type'
        options:
          - name: 'feat'
            description: 'A new feature'
            value: 'feat'
          - name: 'fix'
            description: 'A bug fix'
            value: 'fix'
          - name: 'docs'
            description: 'Documentation only changes'
            value: 'docs'
          - name: 'style'
            description: 'Changes that do not affect the meaning of the code'
            value: 'style'
          - name: 'refactor'
            description: 'A code change that neither fixes a bug nor adds a feature'
            value: 'refactor'
          - name: 'perf'
            description: 'A code change that improves performance'
            value: 'perf'
          - name: 'test'
            description: 'Adding missing tests or correcting existing tests'
            value: 'test'
          - name: 'chore'
            description: 'Changes to the build process or auxiliary tools and libraries'
            value: 'chore'
      - type: 'input'
        title: 'Enter scope (optional)'
        key: 'Scope'
      - type: 'input'
        title: 'Enter commit message'
        key: 'Message'

